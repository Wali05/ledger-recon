# Optional one-click deploy to Render (https://render.com).
#
# This file is NOT required to run the project — see the README quickstart for
# the zero-infrastructure path. It exists so the app can be put back online for
# free without any manual server administration: no SSH, no droplet, no
# hand-written connection strings.
#
# To use: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and point it at the repo. Render reads this file and
# provisions every service below, wiring the connection strings automatically.
#
# Note on the free tier: free web services sleep after ~15 minutes of
# inactivity and take roughly 50 seconds to wake. Fine for a portfolio link,
# not for anything with real users.

databases:
  - name: ledger-recon-db
    databaseName: ledger_recon
    user: recon_user
    plan: free

services:
  - type: redis
    name: ledger-recon-redis
    plan: free
    maxmemoryPolicy: noeviction # Celery brokers must not silently drop queued tasks
    ipAllowList: []

  - type: web
    name: ledger-recon-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-recon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ledger-recon-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ledger-recon-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ledger-recon-redis
          type: redis
          property: connectionString
      - key: ALLOWED_ORIGINS
        sync: false # set to the deployed frontend origin
      - key: GEMINI_API_KEY
        sync: false # set in the Render dashboard, never committed

  - type: worker
    name: ledger-recon-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    dockerCommand: celery -A app.celery_app worker --loglevel=info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ledger-recon-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: ledger-recon-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: ledger-recon-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: ledger-recon-redis
          type: redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
