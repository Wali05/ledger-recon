<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ledger Recon</title>
    <meta
      name="description"
      content="Compare an internal ledger with a bank statement, see the evidence behind every break, and record who resolved it."
    />
    <meta name="theme-color" content="#17263a" />
    <script>
      // Apply the saved or system theme before first paint.
      try {
        var theme = localStorage.getItem("ledger-recon.theme");
        if (theme !== "light" && theme !== "dark")
          theme = matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
