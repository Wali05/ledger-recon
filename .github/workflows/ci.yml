name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ledger_recon_test
          POSTGRES_USER: recon_test
          POSTGRES_PASSWORD: recon_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U recon_test -d ledger_recon_test"
          --health-interval 3s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: ruff check backend scripts && ruff format --check backend scripts
      - name: Test SQLite
        if: matrix.database == 'sqlite'
        run: python -m pytest backend/tests -q
      - name: Test PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_DATABASE_URL: postgresql://recon_test:recon_test@localhost:5432/ledger_recon_test
        run: python -m pytest backend/tests -q
      - run: python scripts/build_demo.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run format:check && npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
